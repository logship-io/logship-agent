name: Build & Release

on:
  push:
    tags:
      - v*

env:
  REGISTRY: cr.logship.io
  IMAGE_NAME: logship-agent
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    strategy:
      matrix:
        include:
          - runtime: win-x64
            os: windows-latest
          - runtime: win-arm64
            os: windows-latest
          - runtime: linux-x64
            os: ubuntu-latest
          - runtime: linux-musl-x64
            os: ubuntu-latest
          - runtime: linux-arm64
            os: ubuntu-22.04-arm
          - runtime: linux-musl-arm64
            os: ubuntu-22.04-arm
          - runtime: osx-x64
            os: macos-latest
          - runtime: osx-arm64
            os: macos-latest
          
    name: Build
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: ARM dependencies
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.runtime == 'linux-arm64' }}
        run: |
          sudo apt-get install gcc make gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu zlib1g-dev

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Build
        if: ${{ matrix.runtime != 'linux-musl-x64' && matrix.runtime != 'linux-musl-arm64' }}
        run: |
          git submodule update --init --recursive
          dotnet publish src/ConsoleHost/Logship.Agent.ConsoleHost.csproj -c Release -r ${{ matrix.runtime }} -o out --self-contained true

      - name: Build MUSL in Alpine
        if: ${{ matrix.runtime == 'linux-musl-x64' || matrix.runtime == 'linux-musl-arm64' }}
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace mcr.microsoft.com/dotnet/sdk:10.0-alpine-aot sh -c '
            echo "Running a bunch of extra steps to make sure PROTOC works"
            export PROTOBUF_PROTOC=/usr/bin/protoc
            export gRPC_PluginFullPath=/usr/bin/grpc_csharp_plugin
            apk add protobuf protobuf-dev grpc grpc-plugins
            git config --global --add safe.directory /workspace
            git submodule update --init --recursive
            dotnet publish src/ConsoleHost/Logship.Agent.ConsoleHost.csproj -c Release -r ${{ matrix.runtime }} -o out --self-contained true
          '

      - name: Package
        shell: pwsh
        run: |
          Get-ChildItem ".\out\Logship.Agent.ConsoleHost.exe", ".\out\Logship.Agent.ConsoleHost", ".\out\appsettings.json" -ErrorAction SilentlyContinue |
          Compress-Archive -DestinationPath "LogshipAgent-${{ matrix.runtime }}.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runtime }}
          path: |
            *.zip
  
  container-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to container registries
        env:
          LSCR_USER: ${{ secrets.LSCR_USER }}
          LSCR_PASS: ${{ secrets.LSCR_PASS }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$LSCR_PASS" | podman login "$REGISTRY" --username "$LSCR_USER" --password-stdin
          printf '%s' "$GHCR_TOKEN" | podman login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Build & Push OCI Image
        run: |
          image="$REGISTRY/$IMAGE_NAME"
          ghcr_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          podman build . --file Containerfile --tag "$image:$GITHUB_REF_NAME"
          for destination in "$image" "$ghcr_image"; do
            podman tag "$image:$GITHUB_REF_NAME" "$destination:latest"
            if [ "$destination" != "$image" ]; then
              podman tag "$image:$GITHUB_REF_NAME" "$destination:$GITHUB_REF_NAME"
            fi
            podman push "$destination:$GITHUB_REF_NAME"
            podman push "$destination:latest"
          done
        
  bin-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    name: Release ${{ github.ref_name }}
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out/
          
      - uses: softprops/action-gh-release@v2
        with:
          name: "Agent Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            out/**/*

