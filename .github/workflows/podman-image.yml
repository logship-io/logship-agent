name: Build & Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

concurrency:
  group: logship-release
  queue: max

env:
  REGISTRY: cr.logship.io
  IMAGE_NAME: logship-agent

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - runtime: win-x64
            os: windows-latest
          - runtime: win-arm64
            os: windows-11-arm
          - runtime: linux-x64
            os: ubuntu-22.04
          - runtime: linux-musl-x64
            os: ubuntu-latest
          - runtime: linux-arm64
            os: ubuntu-22.04-arm
          - runtime: linux-musl-arm64
            os: ubuntu-22.04-arm
          - runtime: osx-x64
            os: macos-15-intel
          - runtime: osx-arm64
            os: macos-latest
          
    name: Build
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Linux Native AOT dependencies
        if: matrix.runtime == 'linux-x64' || matrix.runtime == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
      
      - name: Build
        if: ${{ matrix.runtime != 'linux-musl-x64' && matrix.runtime != 'linux-musl-arm64' }}
        run: |
          git submodule update --init --recursive
          dotnet publish src/ConsoleHost/Logship.Agent.ConsoleHost.csproj -c Release -r ${{ matrix.runtime }} -o out --self-contained true

      - name: Build MUSL in Alpine
        if: ${{ matrix.runtime == 'linux-musl-x64' || matrix.runtime == 'linux-musl-arm64' }}
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace mcr.microsoft.com/dotnet/sdk:11.0.100-alpine3.24-aot sh -ec '
            export PROTOBUF_PROTOC=/usr/bin/protoc
            export gRPC_PluginFullPath=/usr/bin/grpc_csharp_plugin
            apk add git protobuf protobuf-dev grpc grpc-plugins
            git config --global --add safe.directory /workspace
            git submodule update --init --recursive
            dotnet publish src/ConsoleHost/Logship.Agent.ConsoleHost.csproj -c Release -r ${{ matrix.runtime }} -o out --self-contained true
            ./out/Logship.Agent.ConsoleHost --contentRoot /workspace/out --environment openwrt --validate-config=true --Output:account=00000000-0000-0000-0000-000000000001
          '

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "LogshipAgent-${{ matrix.runtime }}.zip"
          Compress-Archive -LiteralPath out/Logship.Agent.ConsoleHost.exe,out/appsettings.json,out/appsettings.full.json -DestinationPath $archive
          (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant() + "  $archive" |
            Set-Content -Encoding ascii -LiteralPath "$archive.sha256"

      - name: Package Unix
        if: runner.os != 'Windows'
        working-directory: out
        run: |
          archive="LogshipAgent-${{ matrix.runtime }}.zip"
          files=(Logship.Agent.ConsoleHost appsettings.json appsettings.full.json)
          if [[ -f appsettings.openwrt.json ]]; then files+=(appsettings.openwrt.json); fi
          zip "../$archive" "${files[@]}"
          cd ..
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runtime }}
          path: |
            *.zip
            *.sha256
  
  container-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to container registries
        env:
          LSCR_USER: ${{ secrets.LSCR_USER }}
          LSCR_PASS: ${{ secrets.LSCR_PASS }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$LSCR_PASS" | podman login "$REGISTRY" --username "$LSCR_USER" --password-stdin
          printf '%s' "$GHCR_TOKEN" | podman login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Build & Push OCI Image
        run: |
          image="$REGISTRY/$IMAGE_NAME"
          ghcr_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          podman build . --file Containerfile --tag "$image:$GITHUB_REF_NAME"
          for destination in "$image" "$ghcr_image"; do
            podman tag "$image:$GITHUB_REF_NAME" "$destination:latest"
            if [ "$destination" != "$image" ]; then
              podman tag "$image:$GITHUB_REF_NAME" "$destination:$GITHUB_REF_NAME"
            fi
            podman push "$destination:$GITHUB_REF_NAME"
            podman push "$destination:latest"
          done
        
  bin-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    name: Release ${{ github.ref_name }}
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: out/
          
      - uses: softprops/action-gh-release@v2
        with:
          name: "Agent Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            out/**/*
            install.sh
            install.ps1

