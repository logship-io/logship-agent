# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net
name: .NET
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - runtime: win-x64
            os: windows-latest
          - runtime: win-arm64
            os: windows-11-arm
          - runtime: linux-x64
            os: ubuntu-22.04
          - runtime: linux-arm64
            os: ubuntu-22.04-arm
          - runtime: osx-x64
            os: macos-15-intel
          - runtime: osx-arm64
            os: macos-latest

    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Init Submodules
      run: git submodule update --init --recursive
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
    - name: Install Linux Native AOT dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang zlib1g-dev
    - name: Publish
      run: dotnet publish src/ConsoleHost/Logship.Agent.ConsoleHost.csproj -c Release -r ${{ matrix.runtime }} -o out --self-contained true
    - name: Validate configuration with the published agent
      shell: pwsh
      run: |
        $agentName = if ($IsWindows) { 'Logship.Agent.ConsoleHost.exe' } else { 'Logship.Agent.ConsoleHost' }
        $agent = (Resolve-Path "out/$agentName").Path
        $configDir = (Resolve-Path src/ConsoleHost/config).Path
        $account = '--Output:account=00000000-0000-0000-0000-000000000001'
        foreach ($preset in 'windows', 'macos', 'linux', 'openwrt', 'full') {
          & $agent --contentRoot $configDir --environment $preset --validate-config=true $account
          if ($LASTEXITCODE -ne 0) { throw "Invalid $preset configuration." }
        }
        & $agent --contentRoot (Resolve-Path out).Path --validate-config=true $account
        if ($LASTEXITCODE -ne 0) { throw 'Invalid packaged configuration.' }
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: logship-agent-${{ matrix.runtime }}
        path: out/
